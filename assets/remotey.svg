<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Pure, Crisp Dark Canvas -->
  <rect width="512" height="512" rx="108" fill="#000000"/>
  <rect width="508" height="508" x="2" y="2" rx="106" fill="none" stroke="#222222" stroke-width="2"/>

  <!-- Minimalist Remote Display Icon -->
  <g transform="translate(136, 110)">
    <!-- Display Housing -->
    <rect x="0" y="0" width="240" height="156" rx="18" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round"/>
    <!-- Stand -->
    <line x1="120" y1="156" x2="120" y2="204" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
    <line x1="72" y1="204" x2="168" y2="204" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
    <!-- Signal Indicator inside Screen -->
    <circle cx="120" cy="78" r="18" fill="#FFFFFF"/>
    <path d="M 86 52 A 48 48 0 0 1 154 52" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
    <path d="M 68 34 A 74 74 0 0 1 172 34" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Typography: Pure SF Pro Display with crisp black stroke -->
  <text x="256" y="410" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif" 
        font-size="64" 
        font-weight="700" 
        letter-spacing="-1.5"
        stroke="#000000"
        stroke-width="8"
        stroke-linejoin="round"
        paint-order="stroke fill"
        fill="#FFFFFF">
    Remotey
  </text>
</svg>
