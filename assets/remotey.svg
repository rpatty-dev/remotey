<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" fill="none">
  <!-- 16:9 Clean Canvas matching PrinterPing styling: dark modern background with subtle grid/glow -->
  <defs>
    <filter id="crispShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <rect width="960" height="540" fill="#090d16"/>

  <!-- Subtle connecting grid pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="960" y2="90"/>
    <line x1="0" y1="180" x2="960" y2="180"/>
    <line x1="0" y1="270" x2="960" y2="270"/>
    <line x1="0" y1="360" x2="960" y2="360"/>
    <line x1="0" y1="450" x2="960" y2="450"/>
    <line x1="160" y1="0" x2="160" y2="540"/>
    <line x1="320" y1="0" x2="320" y2="540"/>
    <line x1="480" y1="0" x2="480" y2="540"/>
    <line x1="640" y1="0" x2="640" y2="540"/>
    <line x1="800" y1="0" x2="800" y2="540"/>
  </g>

  <!-- Central Visual Container: Mac (Left) -> Wire / Signal Beam -> Windows PC (Right) -->
  <g transform="translate(0, -20)" filter="url(#crispShadow)">
    
    <!-- LEFT: MacBook / Mac Client -->
    <g transform="translate(140, 160)">
      <!-- MacBook Screen Top -->
      <rect x="0.5" y="0.5" width="219" height="139" rx="10" fill="#0f172a" stroke="#000000" stroke-width="1.5"/>
      <rect x="10" y="10" width="200" height="120" rx="4" fill="#0284c7" stroke="#000000" stroke-width="1"/>
      <!-- Inner terminal screen -->
      <rect x="16" y="16" width="188" height="108" rx="2" fill="#050811" stroke="#000000" stroke-width="1"/>
      <!-- Terminal dots -->
      <circle cx="28" cy="26" r="3" fill="#ef4444" stroke="#000000" stroke-width="0.5"/>
      <circle cx="38" cy="26" r="3" fill="#f59e0b" stroke="#000000" stroke-width="0.5"/>
      <circle cx="48" cy="26" r="3" fill="#10b981" stroke="#000000" stroke-width="0.5"/>
      <!-- Apple Notch -->
      <rect x="94" y="10" width="32" height="6" rx="2" fill="#0f172a"/>
      <!-- macOS Code Line -->
      <line x1="28" y1="42" x2="110" y2="42" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
      <line x1="28" y1="52" x2="80" y2="52" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <!-- MacBook Base / Keyboard Deck -->
      <path d="M -22 140 L 242 140 L 228 152 L -8 152 Z" fill="#e2e8f0" stroke="#000000" stroke-width="1.5"/>
      <!-- Trackpad notch -->
      <rect x="96" y="141" width="28" height="3" rx="1" fill="#94a3b8"/>
      <!-- Label -->
      <text x="110" y="180" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="16" font-weight="700" fill="#94a3b8">Mac Client (Brain)</text>
    </g>

    <!-- CONNECTING TUNNEL / TAILSCALE WIRE: Mac -> Windows -->
    <g transform="translate(380, 224)">
      <!-- Outer glowing bridge line -->
      <line x1="0" y1="0" x2="200" y2="0" stroke="#0284c7" stroke-width="8" stroke-linecap="round" stroke-opacity="0.3"/>
      <line x1="0" y1="0" x2="200" y2="0" stroke="url(#beam)" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="200" y2="0" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="8 8" stroke-linecap="round"/>
      
      <!-- Directional Pulse Arrow entering Windows -->
      <circle cx="100" cy="0" r="16" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
      <polygon points="96,-6 106,0 96,6" fill="#38bdf8"/>
      
      <!-- Tailscale Mesh Badge -->
      <rect x="55" y="-36" width="90" height="20" rx="10" fill="#0284c7" stroke="#000000" stroke-width="1"/>
      <text x="100" y="-22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.5">PORT 7777</text>
    </g>

    <!-- RIGHT: Windows Work PC Desktop -->
    <g transform="translate(600, 140)">
      <!-- Monitor Chassis -->
      <rect x="0.5" y="0.5" width="239" height="159" rx="8" fill="#1e293b" stroke="#000000" stroke-width="1.5"/>
      <rect x="8" y="8" width="224" height="144" rx="4" fill="#000000" stroke="#000000" stroke-width="1"/>
      
      <!-- Windows 11 Desktop inside -->
      <rect x="12" y="12" width="216" height="136" rx="2" fill="#0369a1" stroke="#000000" stroke-width="1"/>
      
      <!-- Windows 4-pane Logo in screen -->
      <g transform="translate(106, 52)">
        <rect x="0" y="0" width="11" height="11" rx="1.5" fill="#38bdf8" stroke="#000000" stroke-width="0.75"/>
        <rect x="14" y="0" width="11" height="11" rx="1.5" fill="#38bdf8" stroke="#000000" stroke-width="0.75"/>
        <rect x="0" y="14" width="11" height="11" rx="1.5" fill="#38bdf8" stroke="#000000" stroke-width="0.75"/>
        <rect x="14" y="14" width="11" height="11" rx="1.5" fill="#38bdf8" stroke="#000000" stroke-width="0.75"/>
      </g>

      <!-- Taskbar at bottom -->
      <rect x="12" y="132" width="216" height="16" fill="#0f172a" stroke="#000000" stroke-width="0.5"/>
      <rect x="110" y="136" width="20" height="8" rx="2" fill="#38bdf8"/>
      
      <!-- Monitor Stand -->
      <rect x="108" y="160" width="24" height="26" fill="#64748b" stroke="#000000" stroke-width="1"/>
      <rect x="80" y="186" width="80" height="8" rx="4" fill="#475569" stroke="#000000" stroke-width="1"/>
      <!-- Label -->
      <text x="120" y="214" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="16" font-weight="700" fill="#94a3b8">Windows PC (Host)</text>
    </g>
  </g>

  <!-- Typography at bottom: Pure SF Pro Display (PrinterPing style) -->
  <!-- 'Remotey' White & Blue with 1px black stroke -->
  <g transform="translate(480, 460)">
    <text x="0" y="0" 
          text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif" 
          font-size="62" 
          font-weight="800" 
          letter-spacing="-1.5">
      <tspan fill="#ffffff" stroke="#000000" stroke-width="1.5" paint-order="stroke fill">Remote</tspan>
      <tspan fill="#0284c7" stroke="#000000" stroke-width="1.5" paint-order="stroke fill">y</tspan>
    </text>
    <text x="0" y="30" 
          text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif" 
          font-size="16" 
          font-weight="600" 
          letter-spacing="2" 
          fill="#94a3b8">
      AUTONOMOUS COMPUTER USE FOR AI AGENTS
    </text>
  </g>
</svg>
