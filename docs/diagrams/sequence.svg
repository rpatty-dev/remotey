<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%" fill="none">
  <!-- Style Tokens: Editorial Dark System (Cathryn Lavery Sequence Diagram Standards) -->
  <defs>
    <marker id="seq-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="seq-dash" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="420" fill="#090d16"/>

  <!-- Title & Eyebrow -->
  <text x="48" y="40" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1.5">REMOTEY // EXECUTION LIFECYCLE</text>
  <text x="48" y="66" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="20" font-weight="700" fill="#ffffff">Autonomous Computer-Use Loop Sequence</text>

  <!-- Lifeline Columns -->
  <!-- 1: AI Agent Brain -->
  <line x1="140" y1="120" x2="140" y2="380" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
  <rect x="50" y="86" width="180" height="34" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="140" y="108" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="12" font-weight="700" fill="#ffffff">AI Agent Brain</text>

  <!-- 2: Remotey CLI -->
  <line x1="380" y1="120" x2="380" y2="380" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
  <rect x="290" y="86" width="180" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="380" y="108" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="12" font-weight="700" fill="#ffffff">Remotey CLI / Skill</text>

  <!-- 3: Encrypted Tailnet -->
  <line x1="600" y1="120" x2="600" y2="380" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
  <rect x="510" y="86" width="180" height="34" rx="6" fill="#0f2137" stroke="#0284c7" stroke-width="1.2"/>
  <text x="600" y="108" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="12" font-weight="700" fill="#38bdf8">Tailscale Tunnel</text>

  <!-- 4: Remote Host OS -->
  <line x1="820" y1="120" x2="820" y2="380" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
  <rect x="730" y="86" width="180" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="820" y="108" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="12" font-weight="700" fill="#ffffff">Host OS / Hardware</text>

  <!-- ================= SEQUENCE STEPS ================= -->

  <!-- Step 1: Brain triggers screenshot -->
  <line x1="140" y1="148" x2="380" y2="148" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#seq-arrow)"/>
  <text x="260" y="142" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#ffffff">1. remotey screenshot</text>

  <!-- Step 2: CLI routes over Tailscale to Host -->
  <line x1="380" y1="176" x2="820" y2="176" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#seq-arrow)"/>
  <text x="600" y="170" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#38bdf8">2. GET /screenshot (HTTP:7777)</text>

  <!-- Step 3: Host captures and returns PNG -->
  <line x1="820" y1="214" x2="380" y2="214" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#seq-dash)"/>
  <text x="600" y="206" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">3. 200 OK (image/png, &lt;80ms)</text>

  <!-- Step 4: CLI writes to /tmp and notifies Brain -->
  <line x1="380" y1="242" x2="140" y2="242" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#seq-dash)"/>
  <text x="260" y="234" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" fill="#94a3b8">4. Vision buffer updated</text>

  <!-- Step 5: Self-Activation: LLM processes coordinates -->
  <rect x="70" y="260" width="140" height="26" rx="4" fill="#0369a1" stroke="#38bdf8" stroke-width="1"/>
  <text x="140" y="277" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10" font-weight="700" fill="#ffffff">LLM identifies UI target (x, y)</text>

  <!-- Step 6: Brain triggers action -->
  <line x1="140" y1="310" x2="380" y2="310" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#seq-arrow)"/>
  <text x="260" y="304" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#ffffff">5. remotey click 500 300</text>

  <!-- Step 7: CLI executes hardware command -->
  <line x1="380" y1="338" x2="820" y2="338" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#seq-arrow)"/>
  <text x="600" y="332" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#38bdf8">6. POST /click {"x":500, "y":300}</text>

  <!-- Step 8: Hardware simulated & confirmed -->
  <line x1="820" y1="368" x2="140" y2="368" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#seq-dash)"/>
  <text x="480" y="362" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#10b981">7. OK (mouse_event simulated) -> loop repeats</text>

</svg>
